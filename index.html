<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17132a"><title>VIBE</title><meta name="description" content="VIBE: a short-form video app for creativity, learning and music."><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; worker-src 'self'; manifest-src blob: data:; base-uri 'none'; form-action 'none'"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2317132a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23ffb627' font-family='sans-serif' font-weight='900'%3Ev%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#17132a;--fg:#f5f1ff;--card:#241e3d;--mut:#a79fc4;--ac:#ffb627;--ac2:#2ec4b6;--bad:#ff5d6c;--bd:#3a3260;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
:root[data-theme=light]{--bg:#fbf8ff;--fg:#1e1735;--card:#efe9fb;--mut:#6a5f8c;--bd:#d8cff0}
:root[data-contrast=high]{--bd:currentColor;--mut:var(--fg)}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--fg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#241a00;border-color:var(--ac);font-weight:700}
button.dng{color:var(--bad)}:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
a,.lnk{color:var(--ac2);cursor:pointer;text-decoration:none}
#app{display:grid;grid-template-columns:220px 1fr 280px;height:100%}
nav{padding:16px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.logo{font-size:30px;font-weight:900;letter-spacing:-2px;color:var(--ac);margin-bottom:14px}
nav button{text-align:left;border:0;background:none;font-size:16px}nav button.on{background:var(--card);color:var(--ac);font-weight:700}
#side{padding:16px;border-left:1px solid var(--bd);overflow:auto;font-size:14px}
#main{position:relative;overflow:hidden}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;max-width:460px;margin:auto}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;overflow:hidden;color:#fff}
.stage,.stage canvas,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tap{position:absolute;inset:0 70px 120px 0}
.info{position:absolute;left:12px;right:76px;bottom:64px;text-shadow:0 1px 6px #000;font-size:14px;display:grid;gap:5px}
.rail{position:absolute;right:8px;bottom:70px;display:grid;gap:8px;justify-items:center}
.rail button{background:#0008;border-color:#fff3;color:#fff;border-radius:50%;width:52px;height:52px;padding:0;font-size:12px;line-height:1.1}
.ctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.ctl button{padding:0 8px;min-height:36px;background:#0008;color:#fff;border-color:#fff3}.ctl input{padding:0;accent-color:var(--ac)}
.tag{color:var(--ac)}.badge{background:var(--ac);color:#241a00;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.page{position:absolute;inset:0;overflow:auto;padding:18px;background:var(--bg);display:none}
.page.on{display:block}.page>*{max-width:760px;margin-left:auto;margin-right:auto}
h2{margin:6px 0 12px}h3{margin:16px 0 8px;font-size:16px;color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.grow{flex:1}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{aspect-ratio:9/16;border-radius:10px;display:grid;place-items:center;font-size:34px;cursor:pointer;position:relative;overflow:hidden}
.thumb small{position:absolute;bottom:4px;left:6px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
.chip{border-radius:20px;padding:6px 12px;min-height:36px}.chip.on{background:var(--ac);color:#241a00}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}#sheet{background:var(--bg);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;border:1px solid var(--bd)}
@media(min-width:700px){#modal{align-items:center}#sheet{border-radius:20px}}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ac);color:#241a00;padding:10px 16px;border-radius:12px;z-index:99;display:none;font-weight:700;max-width:90%}
#off{display:none;background:var(--bad);color:#fff;text-align:center;padding:4px;font-weight:700;position:fixed;top:0;left:0;right:0;z-index:60}
.cm{margin:10px 0}.cm .rep{margin-left:28px;border-left:2px solid var(--bd);padding-left:10px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.sw>*:last-child{width:auto;max-width:55%}
.sw input[type=checkbox]{width:24px;height:24px}
#bn{display:none}.bar{height:12px;border-radius:6px;background:var(--ac2)}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:1fr 60px}#side,nav{display:none}
#bn{display:flex;border-top:1px solid var(--bd);background:var(--bg)}#bn button{flex:1;border:0;border-radius:0;background:none;font-size:12px}#bn button.on{color:var(--ac)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-motion=off] *{animation:none!important;transition:none!important}
:root[data-text=large]{font-size:19px}
#auth{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;place-items:center;overflow:auto}
</style></head><body>
<div id="off">OFFLINE MODE — cached and local features only</div><div id="toast" role="status" aria-live="polite"></div>
<div id="app"><nav aria-label="Main"><div class="logo">vibe</div></nav>
<div id="main"><div id="feed" aria-label="Video feed"></div><div id="pg" class="page"></div></div>
<aside id="side"></aside><div id="bn"></div></div>
<noscript><p style="padding:20px">VIBE needs JavaScript to run.</p></noscript><div id="auth"></div><div id="modal" role="dialog" aria-modal="true"><div id="sheet"></div></div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));
const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)};
const safe=fn=>(...a)=>{try{return fn(...a)}catch(e){console.error(e);toast('Something went wrong, but VIBE is still running.')}};
/* ---------- storageService (swap for a real backend later) ---------- */
const storageService={mem:{},get(k,d){try{const v=localStorage.getItem('vibe.'+k);return v?JSON.parse(v):d}catch(e){return this.mem[k]??d}},
set(k,v){try{localStorage.setItem('vibe.'+k,JSON.stringify(v))}catch(e){this.mem[k]=v;toast('Storage unavailable: changes last only for this session.')}},
db:null,idb(){return new Promise(r=>{if(this.db)return r(this.db);try{const q=indexedDB.open('vibe',1);q.onupgradeneeded=()=>q.result.createObjectStore('blobs');q.onsuccess=()=>r(this.db=q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
async putBlob(k,b){const d=await this.idb();if(!d)return false;return new Promise(r=>{const t=d.transaction('blobs','readwrite');t.objectStore('blobs').put(b,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})},
async getBlob(k){const d=await this.idb();if(!d)return null;return new Promise(r=>{const q=d.transaction('blobs').objectStore('blobs').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})},
async clearBlobs(){const d=await this.idb();if(d)d.transaction('blobs','readwrite').objectStore('blobs').clear()}};
/* ---------- demo data ---------- */
const CATS=['Technology','Gaming','Music','Sports','Education','Comedy','Science','Business','Zimbabwe','Africa','Global'];
const LEARN=['Math','Science','Coding','Business','History','Languages','Agriculture','Technology'];
const USERS={};const V=[];
const SOUNDS=[...new Set(V.map(v=>v.audio))];
const ADS=[];
const BAD=['idiot','stupid','hate you','loser','shut up','ugly','kill yourself'];
const DEF={me:{id:'me',username:'you',name:'You',bio:'New to VIBE.',skills:{learning:[],teaching:[]},h:300,followers:0},signedUp:false,follows:[],likes:{},saves:{},cols:{Study:[],Music:[],Funny:[],Ideas:[],Sports:[],Technology:[]},
cm:{},cml:{},aff:{cat:{},cr:{},tag:{}},hideC:[],hideT:[],blocked:[],muted:[],blockedWords:[],tagF:[],hist:[],reports:[],uploads:[],drafts:[],learned:{},streak:{n:0,d:''},
seen:{},st:{theme:'system',brk:30,brkOn:true,adFreq:'low',cmode:'all',priv:false,motion:'sys',contrast:false,large:false,restricted:false,who:{comment:'everyone',msg:'followers',mention:'everyone',download:'everyone',remix:'everyone',likes:'me',followers:'everyone'}},
notifs:[],convs:[],
watch:{t:0,n:0,done:0},rate:{}};
let S=Object.assign({},DEF,storageService.get('state',{}));S.st=Object.assign({},DEF.st,S.st);S.st.who=Object.assign({},DEF.st.who,S.st.who||{});
const save=()=>storageService.set('state',S);
const U=id=>id==='me'?S.me:USERS[id];
const vid=id=>V.find(v=>v.id===id)||S.uploads.find(v=>v.id===id);
const grad=h=>`linear-gradient(160deg,hsl(${h%360} 70% 38%),hsl(${(h+60)%360} 70% 22%))`;
const avatar=(u,s=40)=>`<span class="av" style="width:${s}px;height:${s}px;background:${grad(u.h)}">${esc(u.username[0].toUpperCase())}</span>`;
/* ---------- moderationService ---------- */
const moderationService={toxic(t){const l=t.toLowerCase();return BAD.some(w=>l.includes(w))},blockedHit(t){const l=t.toLowerCase();return S.blockedWords.some(w=>w&&l.includes(w))},
visible(c){if(S.st.cmode==='none')return false;if(S.blocked.includes(c.u))return false;if(this.blockedHit(c.x))return false;if(S.st.cmode==='filtered'&&this.toxic(c.x))return false;if(S.st.cmode==='followers'&&c.u!=='me'&&!S.follows.includes(c.u))return false;return true},
spam(key,max,ms){const n=Date.now(),a=(S.rate[key]||[]).filter(t=>n-t<ms);if(a.length>=max){S.rate[key]=a;toast('Slow down a little. Try again in a few seconds.');return true}a.push(n);S.rate[key]=a;return false},
report(kind,id,cat){S.reports.push({kind,id,cat,at:Date.now()});notificationService.add('system','Report received. Thanks for helping keep VIBE safe.');save()}};
/* ---------- notificationService ---------- */
const notificationService={add(t,x){S.notifs.unshift({id:'n'+Date.now(),t,x,r:0});save();badge()}};
/* ---------- recommendationService ---------- */
const recommendationService={norm:x=>1-Math.exp(-Math.max(0,x)),
parts(v){const a=S.aff,s=S.seen[v.id]||{};return{watchCompletion:v.comp,likes:Math.min(1,v.likes/Math.max(1,v.views)*8),comments:Math.min(1,v.comments/Math.max(1,v.views)*60),shares:Math.min(1,v.shares/Math.max(1,v.views)*40),saves:Math.min(1,v.saves/Math.max(1,v.views)*20),creatorAffinity:this.norm(a.cr[v.cid]||0),topicAffinity:this.norm((a.cat[v.cat]||0)+v.tags.reduce((x,t)=>x+(a.tag[t]||0),0)*.5)}},
W:{watchCompletion:.30,likes:.15,comments:.10,shares:.15,saves:.10,creatorAffinity:.10,topicAffinity:.10},
score(v){const p=this.parts(v);let s=0;for(const k in this.W)s+=p[k]*this.W[k];return s},
bucket(v){if(S.follows.includes(v.cid))return'followed creator';if(v.views<20e3)return'new creator';if(v.learn)return'educational';if(['Zimbabwe','Africa'].includes(v.cat))return'local';if(v.views>150e3)return'trending';return'recommended'},
why(v){const p=this.parts(v),k=Object.keys(this.W).map(k=>[k,p[k]*this.W[k]]).sort((a,b)=>b[1]-a[1])[0][0];
const m={watchCompletion:'Viewers tend to watch this one to the end.',likes:'It gets plenty of likes for its reach.',comments:'It sparks conversation.',shares:'People often share it.',saves:'People often save it.',creatorAffinity:`You engage with @${U(v.cid).username}.`,topicAffinity:`You show interest in ${v.cat}.`};
return`Source: ${this.bucket(v)}. Main reason: ${m[k]} Only some of your signals are used and everything stays on this device. You can use More like this, Less like this or Reset recommendations.`},
feed(learn){let pool=[...V,...S.uploads].filter(v=>!S.hideC.includes(v.cid)&&!S.hideT.includes(v.cat)&&!S.blocked.includes(v.cid)&&(!learn||v.learn));
if(S.st.restricted)pool=pool.filter(v=>v.cat!=='Gaming');
const b={};pool.forEach(v=>{const k=this.bucket(v);(b[k]=b[k]||[]).push(v)});
for(const k in b)b[k].sort((x,y)=>this.score(y)-this.score(x)+(Math.random()-.5)*.08);
const out=[],keys=Object.keys(b);let i=0;while(out.length<pool.length){const k=keys[i++%keys.length];if(b[k].length)out.push(b[k].shift())}return out},
signal(v,w){const a=S.aff;a.cat[v.cat]=(a.cat[v.cat]||0)+w;a.cr[v.cid]=(a.cr[v.cid]||0)+w;v.tags.forEach(t=>a.tag[t]=(a.tag[t]||0)+w*.5);save()}};
/* ---------- other services ---------- */
const authService={async h(p,salt){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return btoa(unescape(encodeURIComponent(salt+p)))},
async signup(u,p){if(!/^[a-z0-9_.]{3,20}$/i.test(u))return'Username must be 3-20 letters, numbers, _ or .';if(p.length<8)return'Password must be at least 8 characters.';if(storageService.get('cred'))return'An account already exists in this browser. Log in, or delete local data in Settings.';const salt=Math.random().toString(36).slice(2);storageService.set('cred',{u:u.toLowerCase(),salt,p:await this.h(p,salt)});S.me.username=u;S.me.name=u;S.signedUp=true;save();return''},
async login(u,p){const c=storageService.get('cred');if(!c||c.u!==u.toLowerCase()||c.p!==await this.h(p,c.salt))return'Wrong username or password.';S.signedUp=true;save();return''},logout(){S.signedUp=false;save()}};
const videoService={like(v){if(moderationService.spam('like',10,10000))return;const on=S.likes[v.id]=!S.likes[v.id];v.likes+=on?1:-1;if(on)recommendationService.signal(v,1.5);save()},
save(v,col){const c=S.cols[col];if(!c)return;const i=c.indexOf(v.id);i<0?c.push(v.id):c.splice(i,1);S.saves[v.id]=Object.values(S.cols).some(a=>a.includes(v.id));save()},
follow(id){if(moderationService.spam('follow',6,15000))return;const i=S.follows.indexOf(id);i<0?(S.follows.push(id),recommendationService.signal({cat:'',cid:id,tags:[]},3)):S.follows.splice(i,1);save()}};
const commentService={list(v){return(S.cm[v.id]=S.cm[v.id]||[])},
add(v,x,parent){if(moderationService.spam('cm',5,20000))return;const c={id:'c'+Date.now(),u:'me',x,l:0,t:Date.now(),pin:0,r:[]};parent?parent.r.push(c):this.list(v).push(c);v.comments++;recommendationService.signal(v,1);save()}};
const messageService={send(c,x){if(moderationService.spam('msg',6,15000))return;c.msgs.push({f:'me',x});c.req=0;save()}};
/* ---------- canvas demo clips & players ---------- */
const players=new Map();let active=null,muted=false,rate=1;
function drawClip(c,v,t){const w=c.width=360,h=c.height=640,x=c.getContext('2d');const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${(v.hue+t*8)%360} 70% 38%)`);g.addColorStop(1,`hsl(${(v.hue+80)%360} 70% 18%)`);x.fillStyle=g;x.fillRect(0,0,w,h);
for(let i=0;i<7;i++){x.beginPath();x.fillStyle=`hsla(${v.hue+i*25},80%,60%,.15)`;x.arc(180+Math.sin(t*.7+i)*140,320+Math.cos(t*.5+i*1.7)*230,40+i*14,0,7);x.fill()}
x.font='110px serif';x.textAlign='center';x.fillText(v.emoji,180,300+Math.sin(t*2)*12);x.font='bold 15px sans-serif';x.fillStyle='#fff9';x.fillText('DEMO CLIP · generated on-device',180,370)}
function mkPlayer(card,v){const st=$('.stage',card);let p={v,t:0,playing:false,dur:v.dur,card};
if(v.url){const el=document.createElement('video');el.src=v.url;el.playsInline=true;el.loop=false;el.preload='metadata';el.onerror=()=>{st.innerHTML='<p style="padding:40px;text-align:center">This video failed to load. Try another one.</p>'};st.append(el);
p.el=el;p.play=()=>{el.muted=muted;el.playbackRate=rate;el.play().catch(()=>{})};p.pause=()=>el.pause();p.time=()=>el.currentTime;p.seek=x=>el.currentTime=x;el.onloadedmetadata=()=>p.dur=el.duration||v.dur;el.onended=()=>{p.playing=false}}
else{const c=document.createElement('canvas');st.append(c);p.c=c;drawClip(c,v,0);p.play=()=>p.playing=true;p.pause=()=>p.playing=false;p.time=()=>p.t;p.seek=x=>{p.t=x;drawClip(c,v,p.t)}}
players.set(card,p);return p}
let last=performance.now();
function tick(n){const dt=(n-last)/1000;last=n;try{if(active){const p=players.get(active);if(p&&p.c&&p.playing){p.t+=dt*rate;if(p.t>=p.dur)p.t=0;drawClip(p.c,p.v,p.t)}
if(p){const r=$('.prog',active);if(r&&document.activeElement!==r){r.max=p.dur;r.value=p.time()}p.watched=(p.watched||0)+(p.playing||(p.el&&!p.el.paused)?dt:0);watchTimer(dt)}}}catch(e){}requestAnimationFrame(tick)}
let sinceBreak=0;function watchTimer(dt){if(!S.st.brkOn||!S.st.brk)return;sinceBreak+=dt;if(sinceBreak>=S.st.brk*60){sinceBreak=0;pauseActive();modal(`<h2>Time for a break?</h2><p>You've been watching for ${S.st.brk} minutes. Stretch, drink some water, look away from the screen.</p><div class="row"><button class="pri" data-a="close">Take a break</button><button data-a="close">Keep watching</button><button data-a="brkoff">Turn reminders off</button></div>`)}}
function pauseActive(){const p=players.get(active);p&&p.pause()}
function finishView(card){const p=players.get(card);if(!p)return;p.pause();const w=p.watched||0,v=p.v,c=Math.min(1,w/(p.dur||10));if(w<.1)return;S.watch.t+=w;S.watch.n++;if(c>.8)S.watch.done++;const s=S.seen[v.id]=S.seen[v.id]||{w:0,n:0};s.w+=w;s.n++;
v.views++;if(v.local){v.stats=v.stats||{w:0,n:0,c:0};v.stats.w+=w;v.stats.n++;v.stats.c+=c>.8?1:0}recommendationService.signal(v,w<1.5?-.3:c);p.watched=0;save()}
function activate(card){if(active===card)return;if(active)finishView(active);active=card;const p=players.get(card);if(!p)return;if(card.dataset.ad)return;p.seek(0);if(!document.hidden)p.play();$('.pp',card)&&0}
/* ---------- feed ---------- */
let feedMode='foryou',io;
function cardHTML(v){const u=U(v.cid),own=v.cid==='me';return`<div class="stage"></div><div class="tap" data-a="tap"></div>
<div class="info"><div class="row" style="margin:0"><b data-a="prof" data-id="${u.id}" class="lnk" style="color:#fff">@${esc(u.username)}</b>${u.verified?'<span class="badge" title="Verified">✔ Verified</span>':''}${own?'':`<button class="fol" data-a="follow" data-id="${u.id}" style="min-height:30px;padding:2px 10px;background:#0008;color:#fff">${S.follows.includes(u.id)?'Following':'Follow'}</button>`}</div>
<div>${esc(v.cap)}</div><div>${v.tags.map(t=>`<span class="tag lnk" data-a="tag" data-id="${esc(t)}">${esc(t)}</span>`).join(' ')}</div><div>♪ <span class="lnk" data-a="sound" data-id="${esc(v.audio)}" style="color:#fff">${esc(v.audio)} · ${esc(u.name)}</span></div>
<div><span class="lnk" data-a="why" data-id="${v.id}">Why am I seeing this?</span></div></div>
